
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bang Motion Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #080b16;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 700px; }
    .logo { font-size: 64px; margin-bottom: 15px; }
    h1 { font-size: clamp(38px, 8vw, 65px); margin: 10px 0; }
    h1 span { color: #a78bfa; }
    p { color: #aab1c5; line-height: 1.7; font-size: 17px; }
    .tag {
      display: inline-block;
      border: 1px solid #51418b;
      color: #c4b5fd;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">✦</div>
    <div class="tag">AI MOTION GRAPHICS</div>
    <h1>Bang <span>Motion</span></h1>
    <p>
      Create stunning motion graphics with the power of AI.
      Turn your ideas into beautiful visual experiences.
    </p>
    <p>Welcome to Bang Motion Studio.</p>
  </main>
</body>
</html>
